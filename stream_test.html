<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>流式问答</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    #output { white-space: pre-wrap; border: 1px solid #ddd; padding: 16px;
              min-height: 120px; border-radius: 8px; margin-top: 16px; }
    input, button { padding: 8px; font-size: 14px; }
    input { width: 70%; }
  </style>
</head>
<body>
  <input id="msg" placeholder="问点需要算或搜的，比如 123*456" />
  <button onclick="send()">发送</button>
  <div id="output"></div>

  <script>
    const API_KEY = "my-secret-key-123";

    async function send() {
      const text = document.getElementById("msg").value;
      const out = document.getElementById("output");
      out.textContent = "";

      const resp = await fetch("http://127.0.0.1:8000/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
        body: JSON.stringify({ thread_id: "stream-2", message: text }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // 按 \n\n 切出一条条 SSE
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.replace(/^data: /, "");
          if (!line) continue;
          const data = JSON.parse(line);
          if (data.token) {
            out.textContent += data.token;              // 打字机效果
          } else if (data.event === "waiting_approval") {
            out.textContent += "\n\n⏸️ 等待审批：" + JSON.stringify(data.approval);
          } else if (data.event === "done") {
            out.textContent += "\n\n[完成]";
          }
        }
      }
    }
  </script>
</body>
</html>
